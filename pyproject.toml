[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-mad-scientist"
version = "0.1.0"
description = "Automation to develop and write academic review articles using Generative AI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Sergio Durán" }
]
dependencies = [
  "langchain>=0.2",
  "langchain-openai>=0.1.7",
  "openai>=1.13",
  "pydantic>=2",
  "PyYAML",
  "faiss-cpu",
  "scikit-learn",
  "umap-learn",
  "hdbscan",
  "bertopic",
  "sentence-transformers",
  "pypdf",
  "pandas",
]

[project.urls]
Homepage = "https://github.com/sduran/the-mad-scientist"
